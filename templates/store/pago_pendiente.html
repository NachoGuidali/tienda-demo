<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pago pendiente — VELO Store</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#f6f5f2;--ink:#0b0b0b;--warn:oklch(0.72 0.19 55);--muted:#6b6b66;--line:#e6e4dd;--display:"Archivo Black",Arial,sans-serif;--body:"Inter Tight",Arial,sans-serif;--mono:"JetBrains Mono",monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);display:grid;min-height:100vh;place-items:center;padding:24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:56px 48px;width:min(480px,100%);text-align:center}
  .icon{width:72px;height:72px;border-radius:50%;background:oklch(0.82 0.16 80);display:grid;place-items:center;margin:0 auto 28px}
  .icon svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:2}
  h1{font-family:var(--display);font-size:36px;text-transform:uppercase;letter-spacing:-0.01em;line-height:1}
  p{color:var(--muted);margin-top:14px;font-size:14px;line-height:1.6}
  .btn{display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:#f6f5f2;padding:16px 28px;font-family:var(--mono);font-size:12px;letter-spacing:0.16em;text-transform:uppercase;border-radius:999px;margin-top:32px;text-decoration:none;transition:background .2s}
  .btn:hover{background:oklch(0.82 0.16 80);color:#fff}
</style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
  </div>
  <h1>Pago<br/>pendiente</h1>
  <p>Tu pago está siendo procesado. Recibirás un email cuando sea confirmado. Puede demorar unos minutos.</p>
  <a class="btn" href="/">
    <span>Volver a la tienda</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
  </a>
</div>
</body>
</html>
